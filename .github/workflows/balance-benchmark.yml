name: Balance engine tournament

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [pvp, campaign, mirror]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Get project engine
        run: |
          curl -fL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import project and run regressions
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --path .
          Godot_v4.7.2-stable_linux.x86_64 --headless --single-threaded-scene --path . --script res://tests/run_tests.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --single-threaded-scene --path . --script res://tests/simultaneous_combat_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --single-threaded-scene --path . --script res://tests/balance_bot_test.gd
          python tests/balance_analysis_test.py
      - name: Run paired tournament
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p balance-data
          Godot_v4.7.2-stable_linux.x86_64 --headless --single-threaded-scene --path . --script res://tools/balance_benchmark.gd -- --suite="$SUITE" --seeds=2 --shards=6 --shard="$SHARD" --output="balance-data/$SUITE-$SHARD.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: balance-${{ matrix.suite }}-${{ matrix.shard }}
          path: balance-data/*.jsonl
          if-no-files-found: error
  report:
    needs: battle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-*
          path: balance-data
          merge-multiple: true
      - name: Analyze completed study
        run: python tools/analyze_balance.py 'balance-data/*.jsonl' --output balance-report --label "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: balance-report/
          if-no-files-found: error
