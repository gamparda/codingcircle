name: Build and deploy mandatory update

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny permissions by default. Each job grants only what it needs.
permissions: {}

concurrency:
  group: github-pages-update
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable
  GODOT_WINDOWS_SHA256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  INNO_SETUP_VERSION: 6.7.3
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out policy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enforce deterministic release policy
        run: python tools/ci/validate_workflow_policy.py

  build:
    needs: validate-policy
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache verified Godot export template archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/downloads/templates.zip
          key: godot-export-templates-4.7.2-stable-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

      - name: Download and verify build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-Sha256([string]$Path, [string]$Expected) {
            $actual = (Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected) { throw "SHA-256 mismatch for $Path (got $actual)" }
          }

          New-Item -ItemType Directory -Force .ci/downloads | Out-Null
          $release = "${env:GODOT_VERSION}-${env:GODOT_STATUS}"
          $godotZip = ".ci/downloads/godot.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_win64.exe.zip" -OutFile $godotZip
          Assert-Sha256 $godotZip $env:GODOT_WINDOWS_SHA256
          Expand-Archive $godotZip -DestinationPath .ci/godot -Force
          $godot = (Get-ChildItem .ci/godot -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console executable was not found" }
          "GODOT_CONSOLE=$godot" | Out-File $env:GITHUB_ENV -Append

          $templateZip = ".ci/downloads/templates.zip"
          if (-not (Test-Path $templateZip)) {
            Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_export_templates.tpz" -OutFile $templateZip
          }
          Assert-Sha256 $templateZip $env:GODOT_TEMPLATES_SHA256
          Expand-Archive $templateZip -DestinationPath .ci/templates -Force
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/${env:GODOT_VERSION}.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item ".ci/templates/templates/*" $templateDir -Recurse -Force

          $innoInstaller = ".ci/downloads/innosetup-${env:INNO_SETUP_VERSION}.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-${env:INNO_SETUP_VERSION}.exe" -OutFile $innoInstaller
          Assert-Sha256 $innoInstaller $env:INNO_SETUP_SHA256
          $innoDir = Join-Path $PWD ".ci/inno"
          $process = Start-Process $innoInstaller -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$innoDir"
          )
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($process.ExitCode)" }
          $iscc = Join-Path $innoDir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          "ISCC_PATH=$iscc" | Out-File $env:GITHUB_ENV -Append

      - name: Test and build versioned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.3.${{ github.run_number }}"
          ./tools/build_release.ps1 -GodotPath $env:GODOT_CONSOLE -IsccPath $env:ISCC_PATH -Version $version -Commit "${{ github.sha }}"
          "BUILD_VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Create unsigned release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force site | Out-Null
          Copy-Item dist/CatWarSetup.exe site/CatWarSetup.exe
          $sha = (Get-FileHash site/CatWarSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedAt = (git show -s --format=%cI "${{ github.sha }}").Trim()
          if (-not $publishedAt) { throw "Could not determine the source commit timestamp" }
          $manifest = [ordered]@{
            version = $env:BUILD_VERSION
            commit = "${{ github.sha }}"
            installer_url = "https://gamparda.github.io/codingcircle/CatWarSetup.exe"
            sha256 = $sha
            mandatory = $true
            published_at = $publishedAt
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $PWD "site/update.json"), $manifest + "`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $PWD "site/SHA256SUMS.txt"), "$sha  CatWarSetup.exe`n", [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType File -Force site/.nojekyll | Out-Null

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-bundle
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  sign:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    environment:
      name: release
    steps:
      - name: Download unsigned release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-bundle
          path: site

      # This clean job never checks out or executes repository-controlled code.
      - name: Sign exact update manifest
        shell: pwsh
        env:
          UPDATE_MANIFEST_SIGNING_KEY_B64: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_SIGNING_KEY_B64)) {
            throw "Required release-environment secret UPDATE_MANIFEST_SIGNING_KEY_B64 is not configured"
          }
          $manifestPath = Join-Path $PWD "site/update.json"
          if (-not (Test-Path $manifestPath -PathType Leaf)) { throw "Unsigned manifest is missing" }
          $keyBytes = $null
          $rsa = $null
          try {
            $keyBytes = [Convert]::FromBase64String($env:UPDATE_MANIFEST_SIGNING_KEY_B64)
            $env:UPDATE_MANIFEST_SIGNING_KEY_B64 = $null
            $pem = [System.Text.Encoding]::UTF8.GetString($keyBytes)
            $rsa = [System.Security.Cryptography.RSA]::Create()
            $rsa.ImportFromPem($pem)
            $signature = $rsa.SignData(
              [System.IO.File]::ReadAllBytes($manifestPath),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            [System.IO.File]::WriteAllText(
              (Join-Path $PWD "site/update.json.sig"),
              [Convert]::ToBase64String($signature) + "`n",
              [System.Text.UTF8Encoding]::new($false)
            )
          } finally {
            if ($rsa) { $rsa.Dispose() }
            if ($keyBytes) { [Array]::Clear($keyBytes, 0, $keyBytes.Length) }
          }

      - name: Upload signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-bundle
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-bundle
          path: site
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: 0.3.${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="v${BUILD_VERSION}"
          assets=(site/CatWarSetup.exe site/update.json site/update.json.sig site/SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "Cat War ${BUILD_VERSION}" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "Cat War ${BUILD_VERSION}" --generate-notes --latest --repo "$GITHUB_REPOSITORY"
          fi

  deploy:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download signed update channel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-bundle
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload update channel
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy latest tested build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
