name: Build and deploy mandatory update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-update
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  build:
    needs: multiplayer-preview
    runs-on: windows-latest
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-stable

      - name: Download Godot and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .ci | Out-Null
          $release = "${env:GODOT_VERSION}-${env:GODOT_STATUS}"
          $godotZip = ".ci/godot.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_win64.exe.zip" -OutFile $godotZip
          Expand-Archive $godotZip -DestinationPath .ci/godot -Force
          $godot = (Get-ChildItem .ci/godot -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console executable was not found" }
          "GODOT_CONSOLE=$godot" | Out-File $env:GITHUB_ENV -Append

          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/${env:GODOT_VERSION}.stable"
          $windowsTemplate = Join-Path $templateDir "windows_release_x86_64.exe"
          $androidTemplate = Join-Path $templateDir "android_release.apk"
          if (-not (Test-Path $windowsTemplate) -or -not (Test-Path $androidTemplate)) {
            $templateZip = ".ci/templates.zip"
            Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_export_templates.tpz" -OutFile $templateZip
            Expand-Archive $templateZip -DestinationPath .ci/templates -Force
            New-Item -ItemType Directory -Force $templateDir | Out-Null
            Copy-Item ".ci/templates/templates/*" $templateDir -Recurse -Force
          }

      - name: Resolve release versions from release.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/release_meta.py check
          if ($LASTEXITCODE -ne 0) { throw "Generated version files drifted from release.json (run: python tools/release_meta.py sync)" }
          python tools/release_meta.py github-env | Out-File $env:GITHUB_ENV -Append
          # Always ship a fresh signed APK, without forcing native upgrades for PCK-only changes.
          "BUILD_ANDROID=true" | Out-File $env:GITHUB_ENV -Append

      - name: Configure signed Android export
        if: env.BUILD_ANDROID == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.CATWAR_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.CATWAR_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CATWAR_ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEY_ALIAS -or -not $env:ANDROID_KEY_PASSWORD) {
            throw "Android signing secrets are not configured"
          }
          $keystore = Join-Path $PWD ".ci/catwar-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $settingsDir = Join-Path $env:APPDATA "Godot"
          New-Item -ItemType Directory -Force $settingsDir | Out-Null
          $javaHome = $env:JAVA_HOME -replace '\\', '/'
          $androidHome = $env:ANDROID_HOME -replace '\\', '/'
          $settings = @"
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$javaHome"
          export/android/android_sdk_path = "$androidHome"
          "@
          [System.IO.File]::WriteAllText((Join-Path $settingsDir "editor_settings-4.tres"), $settings, [System.Text.UTF8Encoding]::new($false))
          "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$($keystore -replace '\\', '/')" | Out-File $env:GITHUB_ENV -Append
          "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$env:ANDROID_KEY_ALIAS" | Out-File $env:GITHUB_ENV -Append
          "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$env:ANDROID_KEY_PASSWORD" | Out-File $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run test suites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/run_suite.py all
          if ($LASTEXITCODE -ne 0) { throw "Test suites failed" }

      - name: Build Windows plus content
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = (Get-ChildItem "C:/Program Files (x86)/Inno Setup 6" -Filter ISCC.exe -Recurse | Select-Object -First 1).FullName
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          ./tools/build_release.ps1 -GodotPath $env:GODOT_CONSOLE -IsccPath $iscc -ContentVersion $env:CONTENT_VERSION -Version $env:WINDOWS_VERSION -BinaryVersion $env:ANDROID_BINARY_VERSION -Commit "${{ github.sha }}" -SkipTests

          $presets = Get-Content export_presets.cfg -Raw
          $presets = $presets -replace 'version/code=\d+', "version/code=${{ github.run_number }}"
          [System.IO.File]::WriteAllText((Join-Path $PWD "export_presets.cfg"), $presets, [System.Text.UTF8Encoding]::new($false))

          New-Item -ItemType Directory -Force dist | Out-Null
          if ($env:BUILD_ANDROID -eq "true") {
            & $env:GODOT_CONSOLE --headless --path . --export-release Android dist/CatWar.apk
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/CatWar.apk)) { throw "Android APK export failed" }
            $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME "build-tools") -Directory | Sort-Object Name -Descending | Select-Object -First 1
            & (Join-Path $buildTools.FullName "apksigner.bat") verify --verbose --print-certs dist/CatWar.apk
            if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
            & (Join-Path $buildTools.FullName "aapt2.exe") dump badging dist/CatWar.apk
            if ($LASTEXITCODE -ne 0) { throw "APK package inspection failed" }
          }
          & $env:GODOT_CONSOLE --headless --path . --export-pack Android dist/CatWarContent.pck
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/CatWarContent.pck)) { throw "Android content pack export failed" }

      - name: Create public update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force site | Out-Null
          $previous = Invoke-RestMethod "https://gamparda.github.io/codingcircle/update.json?publish=${{ github.sha }}"
          Copy-Item dist/CatWarSetup.exe site/CatWarSetup.exe
          Copy-Item dist/CatWarContent.pck site/CatWarContent.pck
          if ($env:BUILD_ANDROID -eq "true") {
            Copy-Item dist/CatWar.apk site/CatWar.apk
          } else {
            Invoke-WebRequest $previous.android_apk_url -OutFile site/CatWar.apk
            $reusedAndroidSha = (Get-FileHash site/CatWar.apk -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($reusedAndroidSha -ne [string]$previous.android_sha256) { throw "Reused APK hash changed" }
          }
          $sha = (Get-FileHash site/CatWarSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $androidSha = (Get-FileHash site/CatWar.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $contentSha = (Get-FileHash site/CatWarContent.pck -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $env:WINDOWS_VERSION
            commit = "${{ github.sha }}"
            installer_url = "https://gamparda.github.io/codingcircle/CatWarSetup.exe"
            sha256 = $sha
            android_binary_version = $env:ANDROID_BINARY_VERSION
            android_apk_url = "https://gamparda.github.io/codingcircle/CatWar.apk"
            android_sha256 = $androidSha
            content_pack_version = $env:CONTENT_VERSION
            content_pack_commit = "${{ github.sha }}"
            content_pack_url = "https://gamparda.github.io/codingcircle/CatWarContent.pck"
            content_pack_sha256 = $contentSha
            mandatory = $true
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $PWD "site/update.json"), $manifest + "`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $PWD "site/SHA256SUMS.txt"), "$sha  CatWarSetup.exe`n$androidSha  CatWar.apk`n$contentSha  CatWarContent.pck`n", [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType File -Force site/.nojekyll | Out-Null

      - name: Publish GitHub Release (new versions only)
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:CONTENT_VERSION"
          $assets = @("site/CatWarSetup.exe", "site/CatWar.apk", "site/CatWarContent.pck", "site/update.json", "site/SHA256SUMS.txt")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # A published tag is immutable. Re-pushes of the same version are dev builds:
            # they only update the Pages channel and the dev-build artifact below.
            "published=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "Release $tag already exists and is left untouched. Bump release.json for a new release."
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Cat War $env:CONTENT_VERSION" --notes-file CHANGELOG.md --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release" }
            "published=true" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Keep dev build as workflow artifact
        if: steps.release.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.run_number }}-${{ github.sha }}
          path: site/*
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload update channel
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, multiplayer-preview]
    steps:
      - name: Deploy latest tested build
        id: deployment
        uses: actions/deploy-pages@v4

  multiplayer-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render actual multiplayer scenes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri fonts-noto-cjk
          curl -fL --retry 2 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .ci
          GODOT="$PWD/.ci/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --editor --import --path .
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/room_sessions_ui_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/battle_experience_ui_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/practice_campaign_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/key_bindings_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: multiplayer-preview
          path: .ci/multiplayer-preview/*.png
          if-no-files-found: error
