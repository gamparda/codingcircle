name: Build and deploy mandatory update

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-update-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  tests:
    name: tests (${{ matrix.suite }})
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, network, ui, security, balance, release]
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .ci | Out-Null
          $release = "${env:GODOT_VERSION}-${env:GODOT_STATUS}"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_win64.exe.zip" -OutFile .ci/godot.zip
          Expand-Archive .ci/godot.zip -DestinationPath .ci/godot -Force
          $godot = (Get-ChildItem .ci/godot -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console executable was not found" }
          "GODOT_CONSOLE=$godot" | Out-File $env:GITHUB_ENV -Append

      - name: Run ${{ matrix.suite }} suite
        shell: pwsh
        run: |
          python tools/run_suite.py ${{ matrix.suite }}
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.suite }} suite failed" }

  # The builds run alongside the tests; only publishing waits for the tests to pass.
  build-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-stable

      - name: Download Godot and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .ci | Out-Null
          $release = "${env:GODOT_VERSION}-${env:GODOT_STATUS}"
          $godotZip = ".ci/godot.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_win64.exe.zip" -OutFile $godotZip
          Expand-Archive $godotZip -DestinationPath .ci/godot -Force
          $godot = (Get-ChildItem .ci/godot -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console executable was not found" }
          "GODOT_CONSOLE=$godot" | Out-File $env:GITHUB_ENV -Append

          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/${env:GODOT_VERSION}.stable"
          $windowsTemplate = Join-Path $templateDir "windows_release_x86_64.exe"
          $androidTemplate = Join-Path $templateDir "android_release.apk"
          if (-not (Test-Path $windowsTemplate) -or -not (Test-Path $androidTemplate)) {
            $templateZip = ".ci/templates.zip"
            Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_export_templates.tpz" -OutFile $templateZip
            Expand-Archive $templateZip -DestinationPath .ci/templates -Force
            New-Item -ItemType Directory -Force $templateDir | Out-Null
            Copy-Item ".ci/templates/templates/*" $templateDir -Recurse -Force
          }

      - name: Resolve release versions from release.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/release_meta.py check
          if ($LASTEXITCODE -ne 0) { throw "Generated version files drifted from release.json (run: python tools/release_meta.py sync)" }
          python tools/release_meta.py github-env | Out-File $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer and desktop content
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = (Get-ChildItem "C:/Program Files (x86)/Inno Setup 6" -Filter ISCC.exe -Recurse | Select-Object -First 1).FullName
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          ./tools/build_release.ps1 -GodotPath $env:GODOT_CONSOLE -IsccPath $iscc -ContentVersion $env:CONTENT_VERSION -Version $env:WINDOWS_VERSION -BinaryVersion $env:ANDROID_BINARY_VERSION -Commit "${{ github.sha }}" -SkipTests
          # Game data for Windows clients and the Linux server: same code, no executable. Updating it avoids a full installer.
          & $env:GODOT_CONSOLE --headless --path . --export-pack "Windows Desktop" dist/CatWarDesktop.pck
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/CatWarDesktop.pck)) { throw "Desktop content pack export failed" }

      - uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: |
            dist/CatWarSetup.exe
            dist/CatWarDesktop.pck
          if-no-files-found: error
          retention-days: 1

  build-android:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-stable

      - name: Download Godot and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .ci | Out-Null
          $release = "${env:GODOT_VERSION}-${env:GODOT_STATUS}"
          $godotZip = ".ci/godot.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_win64.exe.zip" -OutFile $godotZip
          Expand-Archive $godotZip -DestinationPath .ci/godot -Force
          $godot = (Get-ChildItem .ci/godot -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console executable was not found" }
          "GODOT_CONSOLE=$godot" | Out-File $env:GITHUB_ENV -Append

          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/${env:GODOT_VERSION}.stable"
          $windowsTemplate = Join-Path $templateDir "windows_release_x86_64.exe"
          $androidTemplate = Join-Path $templateDir "android_release.apk"
          if (-not (Test-Path $windowsTemplate) -or -not (Test-Path $androidTemplate)) {
            $templateZip = ".ci/templates.zip"
            Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$release/Godot_v${env:GODOT_VERSION}-${env:GODOT_STATUS}_export_templates.tpz" -OutFile $templateZip
            Expand-Archive $templateZip -DestinationPath .ci/templates -Force
            New-Item -ItemType Directory -Force $templateDir | Out-Null
            Copy-Item ".ci/templates/templates/*" $templateDir -Recurse -Force
          }

      - name: Resolve release versions from release.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/release_meta.py check
          if ($LASTEXITCODE -ne 0) { throw "Generated version files drifted from release.json (run: python tools/release_meta.py sync)" }
          python tools/release_meta.py github-env | Out-File $env:GITHUB_ENV -Append

      - name: Set up Java 17 for the Gradle Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache the sign-in plugin
        id: signin-cache
        uses: actions/cache@v4
        with:
          path: android/plugins/keepfall_signin/build/outputs/aar/keepfall_signin-release.aar
          key: keepfall-signin-${{ hashFiles('android/plugins/keepfall_signin/src/**', 'android/plugins/keepfall_signin/*.gradle', 'android/plugins/keepfall_signin/gradle.properties', 'android/plugins/keepfall_signin/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Prepare Gradle Android build and sign-in plugin
        shell: pwsh
        env:
          SIGNIN_CACHED: ${{ steps.signin-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"
          # Versions follow the Godot build template (android/build/config.gradle).
          $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager.bat"
          "y`ny`ny`ny`ny`ny`n" | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Android SDK component install failed" }

          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/${env:GODOT_VERSION}.stable"
          Remove-Item android/build -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive (Join-Path $templateDir "android_source.zip") -DestinationPath android/build -Force
          [System.IO.File]::WriteAllText((Join-Path $PWD "android/.build_version"), "${env:GODOT_VERSION}.stable", [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType File -Force android/build/.gdignore | Out-Null
          # A Gradle daemon keeps Godot's output pipe open on Windows, so the headless export never returns.
          Add-Content android/build/gradle.properties "`norg.gradle.daemon=false"
          "GRADLE_OPTS=-Dorg.gradle.daemon=false" | Out-File $env:GITHUB_ENV -Append

          if ($env:SIGNIN_CACHED -ne "true") {
            # Maven Central rate-limits now and then; retry the plugin build.
            Push-Location android/plugins/keepfall_signin
            $built = $false
            for ($attempt = 1; $attempt -le 3 -and -not $built; $attempt++) {
              & ./gradlew.bat --no-daemon assembleRelease
              if ($LASTEXITCODE -eq 0) { $built = $true } else { Start-Sleep -Seconds 60 }
            }
            Pop-Location
            if (-not $built) { throw "Sign-in plugin build failed" }
          }
          New-Item -ItemType Directory -Force addons/keepfall_signin/bin | Out-Null
          Copy-Item android/plugins/keepfall_signin/build/outputs/aar/keepfall_signin-release.aar addons/keepfall_signin/bin/ -Force

      - name: Configure signed Android export
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.CATWAR_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.CATWAR_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CATWAR_ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEY_ALIAS -or -not $env:ANDROID_KEY_PASSWORD) {
            throw "Android signing secrets are not configured"
          }
          $keystore = Join-Path $PWD ".ci/catwar-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $settingsDir = Join-Path $env:APPDATA "Godot"
          New-Item -ItemType Directory -Force $settingsDir | Out-Null
          $javaHome = $env:JAVA_HOME -replace '\\', '/'
          $androidHome = $env:ANDROID_HOME -replace '\\', '/'
          $settings = @"
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$javaHome"
          export/android/android_sdk_path = "$androidHome"
          "@
          foreach ($name in @("editor_settings-4.tres", "editor_settings-4.7.tres")) {
            [System.IO.File]::WriteAllText((Join-Path $settingsDir $name), $settings, [System.Text.UTF8Encoding]::new($false))
          }
          "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$($keystore -replace '\\', '/')" | Out-File $env:GITHUB_ENV -Append
          "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$env:ANDROID_KEY_ALIAS" | Out-File $env:GITHUB_ENV -Append
          "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$env:ANDROID_KEY_PASSWORD" | Out-File $env:GITHUB_ENV -Append

      - name: Build signed APK and Android content
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $presets = Get-Content export_presets.cfg -Raw
          $presets = $presets -replace 'version/code=\d+', "version/code=${{ github.run_number }}"
          [System.IO.File]::WriteAllText((Join-Path $PWD "export_presets.cfg"), $presets, [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force dist | Out-Null
          # Gradle export: fetches the sign-in plugin's Maven dependencies, so retry on rate limits.
          # Each attempt is time-limited, so a stuck build fails the job instead of hanging it.
          $exported = $false
          for ($attempt = 1; $attempt -le 3 -and -not $exported; $attempt++) {
            $export = Start-Process -FilePath $env:GODOT_CONSOLE -ArgumentList "--headless", "--path", ".", "--export-release", "Android", "dist/CatWar.apk" -NoNewWindow -PassThru
            $null = $export.Handle
            if (-not $export.WaitForExit(1200000)) {
              & taskkill /T /F /PID $export.Id | Out-Null
              throw "Android APK export timed out"
            }
            if ($export.ExitCode -eq 0 -and (Test-Path dist/CatWar.apk)) { $exported = $true } else { Start-Sleep -Seconds 60 }
          }
          if (-not $exported) { throw "Android APK export failed" }
          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME "build-tools") -Directory | Sort-Object Name -Descending | Select-Object -First 1
          & (Join-Path $buildTools.FullName "apksigner.bat") verify --verbose --print-certs dist/CatWar.apk
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
          & (Join-Path $buildTools.FullName "aapt2.exe") dump badging dist/CatWar.apk
          if ($LASTEXITCODE -ne 0) { throw "APK package inspection failed" }
          $manifest = & (Join-Path $buildTools.FullName "aapt2.exe") dump xmltree --file AndroidManifest.xml dist/CatWar.apk | Out-String
          if ($manifest -notmatch "org\.godotengine\.plugin\.v2\.KeepfallSignIn") { throw "Sign-in plugin missing from the APK" }
          & $env:GODOT_CONSOLE --headless --path . --export-pack Android dist/CatWarContent.pck
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/CatWarContent.pck)) { throw "Android content pack export failed" }

      - uses: actions/upload-artifact@v5
        with:
          name: android-build
          path: |
            dist/CatWar.apk
            dist/CatWarContent.pck
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: [tests, multiplayer-preview, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested source
        uses: actions/checkout@v5

      - name: Resolve release versions from release.json
        shell: bash
        run: python3 tools/release_meta.py github-env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create public update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force site | Out-Null
          foreach ($file in @("CatWarSetup.exe", "CatWar.apk", "CatWarContent.pck", "CatWarDesktop.pck")) {
            Copy-Item "dist/$file" "site/$file"
          }
          $sha = (Get-FileHash site/CatWarSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $androidSha = (Get-FileHash site/CatWar.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $contentSha = (Get-FileHash site/CatWarContent.pck -Algorithm SHA256).Hash.ToLowerInvariant()
          $desktopSha = (Get-FileHash site/CatWarDesktop.pck -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $env:WINDOWS_VERSION
            commit = "${{ github.sha }}"
            installer_url = "https://gamparda.github.io/codingcircle/CatWarSetup.exe"
            sha256 = $sha
            android_binary_version = $env:ANDROID_BINARY_VERSION
            android_apk_url = "https://gamparda.github.io/codingcircle/CatWar.apk"
            android_sha256 = $androidSha
            content_pack_version = $env:CONTENT_VERSION
            content_pack_commit = "${{ github.sha }}"
            content_pack_url = "https://gamparda.github.io/codingcircle/CatWarContent.pck"
            content_pack_sha256 = $contentSha
            desktop_pack_version = $env:CONTENT_VERSION
            desktop_pack_commit = "${{ github.sha }}"
            desktop_pack_url = "https://gamparda.github.io/codingcircle/CatWarDesktop.pck"
            desktop_pack_sha256 = $desktopSha
            mandatory = $true
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $PWD "site/update.json"), $manifest + "`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $PWD "site/SHA256SUMS.txt"), "$sha  CatWarSetup.exe`n$androidSha  CatWar.apk`n$contentSha  CatWarContent.pck`n$desktopSha  CatWarDesktop.pck`n", [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType File -Force site/.nojekyll | Out-Null

      - name: Publish GitHub Release (new versions only)
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:CONTENT_VERSION"
          $assets = @("site/CatWarSetup.exe", "site/CatWar.apk", "site/CatWarContent.pck", "site/CatWarDesktop.pck", "site/update.json", "site/SHA256SUMS.txt")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # A published tag is immutable. Re-pushes of the same version are dev builds:
            # they only update the Pages channel and the dev-build artifact below.
            "published=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "Release $tag already exists and is left untouched. Bump release.json for a new release."
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Keepfall $env:CONTENT_VERSION" --notes-file CHANGELOG.md --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release" }
            "published=true" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Keep dev build as workflow artifact
        if: steps.release.outputs.published != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dev-build-${{ github.run_number }}-${{ github.sha }}
          path: site/*
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload update channel
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Deploy latest tested build
        id: deployment
        uses: actions/deploy-pages@v4

  multiplayer-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Prepare preview renderer
        timeout-minutes: 13
        shell: bash
        run: |
          set -euxo pipefail
          # Refresh Ubuntu packages without waiting on unrelated third-party repositories.
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo timeout 90s apt-get "${apt_options[@]}" update
          # fonts-noto-cjk is ~60 MB. If the runner's Azure mirror stalls on it, retry from the main Ubuntu archive.
          if ! sudo timeout 180s apt-get "${apt_options[@]}" install -y xvfb libgl1-mesa-dri fonts-noto-cjk; then
            # Runner sources resolve through a mirror list; point both at the main archive.
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            sudo timeout 90s apt-get "${apt_options[@]}" update
            sudo timeout 300s apt-get "${apt_options[@]}" install -y xvfb libgl1-mesa-dri fonts-noto-cjk
          fi
      - name: Render actual multiplayer scenes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .ci
          GODOT="$PWD/.ci/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --editor --import --path .
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/room_sessions_ui_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/battle_experience_ui_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/practice_campaign_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
          LP_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --single-threaded-scene --rendering-method gl_compatibility --rendering-driver opengl3 --path . --script tests/key_bindings_test.gd -- --capture-dir="$PWD/.ci/multiplayer-preview"
      - uses: actions/upload-artifact@v5
        with:
          name: multiplayer-preview
          path: .ci/multiplayer-preview/*.png
          if-no-files-found: error
